{% if value is None %}<div class="score"><div class="n"><b aria-hidden="true">—</b><span class="mono muted">Brak danych</span></div><small>Za mało zweryfikowanych kryteriów, by policzyć potencjał.</small></div>{% else %}<div class="score" role="img" aria-label="Potencjał: {{ value }}/100, poziom {{ level|lower }}"><div class="n"><b>{{ value }}</b><span class="mono muted">/ 100 · {{ level }}</span></div><div class="bar">{% for on in bars %}<i{% if on %} class="on"{% endif %}></i>{% endfor %}</div>{% if label %}<small>Potencjał · szacunek systemu</small>{% endif %}</div>{% endif %}
