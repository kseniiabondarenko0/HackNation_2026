<!doctype html><html lang="pl"><head><meta charset="utf-8"><title>{% block title %}Radar Innowacji{% endblock %}</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{font:15px/1.6 system-ui,sans-serif;margin:0;background:#f4f6f8;color:#182d3b}header{background:#123e52;color:white;padding:18px max(20px,calc((100vw - 1100px)/2));display:flex;gap:28px;align-items:center;flex-wrap:wrap}header a{color:#d9eef4;text-decoration:none;margin-right:18px}header strong{font-size:19px}main{max-width:1100px;margin:28px auto;padding:0 20px}h1{font-size:28px;margin:0 0 6px}h2{font-size:20px}.card,.metric{background:white;border:1px solid #dee5e9;border-radius:12px;padding:20px;margin:14px 0}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}.metric strong{display:block;font-size:26px}.muted{color:#627482;font-size:13px}.err{color:#a52b36}.badge{display:inline-block;background:#e5eef2;padding:3px 9px;border-radius:20px;font-size:12px}.ok{background:#e4f2e9;color:#236142}.warn{background:#fff0d7;color:#815014}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}a{color:#12617d}input,select,button,.button{font:inherit;border:1px solid #cad6dc;border-radius:7px;padding:8px 12px}input{min-width:180px}button,.button{background:#164e65;color:white;text-decoration:none;cursor:pointer}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.article-text{max-width:850px;overflow-wrap:anywhere}.article-text p{margin:0 0 18px}.meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #e5ebef;vertical-align:top}th{font-size:12px;color:#627482}footer{margin:35px 0;color:#627482;font-size:12px}.notice{background:#e7f2f7;padding:12px 18px;border-radius:8px;margin-bottom:14px}.pagination{display:flex;gap:16px;align-items:center;margin:20px 0}.table-wrap{overflow-x:auto}code{overflow-wrap:anywhere}
</style></head><body><header><strong>Radar Innowacji</strong><nav><a href="{% url 'radar' %}">Publikacje</a><a href="{% url 'sources' %}">Źródła</a><a href="{% url 'runs' %}">Historia zbierania</a><a href="/admin/">Zarządzanie</a></nav></header><main>
{% for message in messages %}<div class="notice">{{ message }}</div>{% endfor %}
{% block content %}{% endblock %}<footer>V0.1 · Automatyczne zbieranie publikacji z publicznych źródeł. Daty i godziny: Europe/Warsaw.</footer></main></body></html>
