services:
  web:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      DB_PATH: /data/db.sqlite3
      ALLOWED_HOSTS: localhost,127.0.0.1
      OLLAMA_URL: http://host.docker.internal:11434   # Ollama runs on the Mac, not in the container
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["radar-data:/data"]
  worker:
    build: .
    command: python manage.py collect_sources
    env_file: [.env]
    environment:
      DB_PATH: /data/db.sqlite3
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["radar-data:/data"]
    depends_on: [web]
volumes:
  radar-data:
